name: Build and publish Pages and release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: nazca-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_VERSION: 0.1.${{ github.run_number }}

jobs:
  build-pages:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stamp this run's numeric root version
        shell: pwsh
        run: >-
          node scripts/stamp-release-version.mjs --version $env:RELEASE_VERSION
          --package package.json --lock package-lock.json

      - name: Install project packages
        shell: pwsh
        run: npm ci --audit=false

      - name: Build the Pages bundle
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'nazca-pages-build.log'
          & node scripts/run-vinext.mjs build --pages 2>&1 | Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE
          "BUILD_EXIT=$exitCode" | Add-Content -LiteralPath $log
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Upload the Pages bundle
        if: ${{ always() }}
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: dist/client

      - name: Upload build evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: nazca-pages-build-${{ github.run_id }}
          path: |
            dist/client/**
            ${{ runner.temp }}/nazca-pages-build.log
          if-no-files-found: warn
          retention-days: 7

  deploy-pages:
    if: needs.build-pages.result == 'success' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    needs: build-pages
    runs-on: windows-2025
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-release:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Stamp this run's numeric package and lockfile versions
        shell: pwsh
        run: >-
          node scripts/stamp-release-version.mjs --version $env:RELEASE_VERSION
          --package package.json --lock package-lock.json
          --package desktop/package.json --lock desktop/package-lock.json

      - name: Verify stamped package identity
        shell: pwsh
        run: >-
          node scripts/stamp-release-version.mjs --version $env:RELEASE_VERSION
          --package package.json --lock package-lock.json
          --package desktop/package.json --lock desktop/package-lock.json --check

      - name: Install root packages from the lockfile
        shell: pwsh
        run: npm ci --audit=false

      - name: Build the root-path offline reader
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'nazca-release-build.log'
          & node scripts/run-vinext.mjs build --static 2>&1 | Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE
          "BUILD_EXIT=$exitCode" | Add-Content -LiteralPath $log
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Package the offline reader
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/package-offline-bundle.ps1

      - name: Install desktop packages from the lockfile
        shell: pwsh
        run: npm --prefix desktop ci --audit=false

      - name: Build the unsigned Squirrel.Windows installer
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'nazca-installer-build.log'
          & node scripts/desktop/package-squirrel.mjs 2>&1 | Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE
          "PACKAGE_EXIT=$exitCode" | Add-Content -LiteralPath $log
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Assemble and hash release assets
        shell: pwsh
        run: |
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $stage = [IO.Path]::GetFullPath((Join-Path $workspace 'release-staging'))
          if (-not $stage.StartsWith($workspace + [IO.Path]::DirectorySeparatorChar)) { throw "Unsafe release staging path: $stage" }
          if (Test-Path -LiteralPath $stage) { Remove-Item -LiteralPath $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $rootPackage = Get-Content -Raw (Join-Path $workspace 'package.json') | ConvertFrom-Json
          $desktopPackage = Get-Content -Raw (Join-Path $workspace 'desktop\package.json') | ConvertFrom-Json
          if ($rootPackage.version -ne $env:RELEASE_VERSION -or $desktopPackage.version -ne $env:RELEASE_VERSION) { throw "Package manifests do not carry this run's release version." }
          $staticName = "nazca-railway-static-$env:RELEASE_VERSION.zip"
          $setupName = "Nazca-Railway-$env:RELEASE_VERSION-Setup.exe"
          $static = Join-Path $workspace (Join-Path 'outputs' $staticName)
          $squirrel = Join-Path $workspace 'dist\desktop\squirrel-windows'
          $setup = Get-ChildItem -LiteralPath $squirrel -File | Where-Object { $_.Name -ceq $setupName } | Select-Object -First 1
          $releases = Get-ChildItem -LiteralPath $squirrel -File | Where-Object { $_.Name -ceq 'RELEASES' } | Select-Object -First 1
          $full = Get-ChildItem -LiteralPath $squirrel -File | Where-Object { $_.Name -match '(?i)\.nupkg$' -and $_.Name -notmatch '(?i)\.delta\.nupkg$' } | Select-Object -First 1
          if (-not (Test-Path -LiteralPath $static -PathType Leaf)) { throw "Static bundle is missing: $static" }
          if (-not $setup -or -not $releases -or -not $full) { throw "Squirrel.Windows outputs are incomplete for $env:RELEASE_VERSION." }
          Copy-Item -LiteralPath $static -Destination (Join-Path $stage $staticName)
          Copy-Item -LiteralPath $setup.FullName -Destination (Join-Path $stage $setupName)
          Copy-Item -LiteralPath $releases.FullName -Destination (Join-Path $stage 'RELEASES')
          Copy-Item -LiteralPath $full.FullName -Destination (Join-Path $stage $full.Name)
          Get-ChildItem -LiteralPath $squirrel -File -Filter '*.delta.nupkg' | ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $stage $_.Name) }
          Copy-Item -LiteralPath (Join-Path $squirrel 'release-manifest.json') -Destination (Join-Path $stage 'desktop-release-manifest.json')
          Copy-Item -LiteralPath (Join-Path $workspace 'data\corpus\reader\v0.1.0\manifest.json') -Destination (Join-Path $stage 'corpus-manifest.json')
          & node scripts/count-lines.mjs --json | Set-Content -LiteralPath (Join-Path $stage 'line-count-report.json') -Encoding utf8
          $desktopManifest = Get-Content -Raw (Join-Path $stage 'desktop-release-manifest.json') | ConvertFrom-Json
          $combined = [ordered]@{ schemaVersion = 1; sourceCommit = (git rev-parse HEAD); version = $env:RELEASE_VERSION; staticBundle = $staticName; desktopManifest = 'desktop-release-manifest.json'; desktopFiles = $desktopManifest.files; generatedAt = (Get-Date).ToUniversalTime().ToString('o') }
          $combined | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $stage 'combined-release-manifest.json') -Encoding utf8
          $sumLines = Get-ChildItem -LiteralPath $stage -File | Sort-Object Name | ForEach-Object { $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); "$hash  $($_.Name)" }
          $sumLines | Set-Content -LiteralPath (Join-Path $stage 'SHA256SUMS.txt') -Encoding ascii
          foreach ($file in Get-ChildItem -LiteralPath $stage -File) { if ($file.Length -le 0) { throw "Release asset is empty: $($file.Name)" } }

      - name: Upload safe release outputs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: nazca-release-assets-${{ github.run_id }}
          path: release-staging/*
          if-no-files-found: warn
          retention-days: 7

      - name: Upload release logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: nazca-release-logs-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/nazca-release-build.log
            ${{ runner.temp }}/nazca-installer-build.log
          if-no-files-found: warn
          retention-days: 7

  publish-release:
    if: needs.build-release.result == 'success' && needs.deploy-pages.result == 'success' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    needs: [build-release, deploy-pages]
    runs-on: windows-2025
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
      EXPECTED_SHA: ${{ github.sha }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out source for release metadata
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download generated release outputs
        uses: actions/download-artifact@v4
        with:
          name: nazca-release-assets-${{ github.run_id }}
          path: release-staging

      - name: Create or locate this run's exact release record
        id: release
        shell: pwsh
        run: |
          function Get-AllReleases {
            $all = @()
            for ($page = 1; ; $page += 1) {
              $batch = @(gh api "repos/$env:REPOSITORY/releases?per_page=100&page=$page" | ConvertFrom-Json)
              $all += $batch
              if ($batch.Count -lt 100) { return $all }
            }
          }
          function Resolve-Commit([string]$Reference) {
            return (gh api "repos/$env:REPOSITORY/commits/$Reference" --jq .sha).Trim()
          }
          function Set-Output([string]$Name, [string]$Value) {
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "$Name=$Value" -Encoding utf8
          }
          $releaseTag = "v$env:RELEASE_VERSION"
          if ($releaseTag -notmatch '^v\d+\.\d+\.\d+$') { throw "Release tag is not numeric: $releaseTag" }
          $tagged = @(Get-AllReleases | Where-Object { $_.tag_name -ceq $releaseTag })
          if ($tagged.Count -gt 1) { throw "Expected at most one release record for $releaseTag, found $($tagged.Count)." }
          if ($tagged.Count -eq 1) {
            $existing = $tagged[0]
            $actualTarget = Resolve-Commit ([string]$existing.target_commitish)
            if ($actualTarget -ne $env:EXPECTED_SHA) { throw "Existing $releaseTag targets $actualTarget, expected $env:EXPECTED_SHA." }
            Set-Output 'release_id' ([string]$existing.id)
            Set-Output 'was_published' ([string](-not $existing.draft).ToLowerInvariant())
            return
          }

          $sourceRelease = gh api "repos/$env:REPOSITORY/releases/tags/v0.1.1" | ConvertFrom-Json
          if ($sourceRelease.draft -or $sourceRelease.prerelease -or $sourceRelease.tag_name -cne 'v0.1.1') { throw 'The v0.1.1 corpus seed must be one exact published release.' }
          $seedNames = @('nazca-current-corpus-0.1.0.zip', 'nazca-current-corpus-0.1.0.zip.sha256', 'archive-manifest.json')
          $seedAssets = @{}
          foreach ($seedName in $seedNames) {
            $matches = @($sourceRelease.assets | Where-Object name -ceq $seedName)
            if ($matches.Count -ne 1 -or $matches[0].size -le 0) { throw "Published v0.1.1 source release does not contain exactly one nonempty $seedName asset." }
            $seedAssets[$seedName] = $matches[0]
          }
          $seedDirectory = Join-Path $env:RUNNER_TEMP "nazca-corpus-seed-$($env:GITHUB_RUN_ID)"
          New-Item -ItemType Directory -Path $seedDirectory -Force | Out-Null
          try {
            foreach ($seedName in $seedNames) {
              gh release download v0.1.1 --repo $env:REPOSITORY --pattern $seedName --dir $seedDirectory --clobber
              if ($LASTEXITCODE -ne 0) { throw "Authenticated download failed for $seedName." }
              $seedPath = Join-Path $seedDirectory $seedName
              if (-not (Test-Path -LiteralPath $seedPath -PathType Leaf) -or (Get-Item -LiteralPath $seedPath).Length -ne [int64]$seedAssets[$seedName].size) { throw "Downloaded $seedName has an unexpected size." }
            }
            $trackedCorpus = Get-Content -Raw (Join-Path $env:GITHUB_WORKSPACE 'data\corpus\reader\v0.1.0\manifest.json') | ConvertFrom-Json
            $archiveName = [string]$trackedCorpus.archive.name
            if ($archiveName -cne 'nazca-current-corpus-0.1.0.zip') { throw 'Tracked corpus manifest changed the immutable v0.1.0 archive name.' }
            $archivePath = Join-Path $seedDirectory $archiveName
            $archiveHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($archiveHash -ne $trackedCorpus.archive.sha256) { throw 'Downloaded raw corpus archive digest does not match the tracked corpus manifest.' }
            $checksumText = Get-Content -Raw -LiteralPath (Join-Path $seedDirectory 'nazca-current-corpus-0.1.0.zip.sha256')
            if (-not $checksumText.Contains($trackedCorpus.archive.sha256) -or -not $checksumText.Contains($archiveName)) { throw 'Downloaded raw corpus checksum does not match the tracked archive manifest.' }
            $archiveManifest = Get-Content -Raw -LiteralPath (Join-Path $seedDirectory 'archive-manifest.json') | ConvertFrom-Json
            if ($archiveManifest.archive -cne $archiveName -or $archiveManifest.articlePages -ne $trackedCorpus.counts.articles -or $archiveManifest.redirectPages -ne $trackedCorpus.counts.redirects) { throw 'Downloaded archive manifest does not match the tracked corpus manifest.' }

            $body = @(
              "# Nazca Railway $releaseTag",
              '',
              'This is a numeric release for one immutable source commit.',
              '',
              'No unique verified catalog code name was selected for this run, so this release intentionally uses version-only copy.',
              '',
              '**Public reader:** https://ding-ding-projects.github.io/nazca/',
              '',
              'The raw current-corpus archive remains the validated `nazca-current-corpus-0.1.0.zip` seed from the published v0.1.1 release.',
              '',
              '## Verification boundary',
              '',
              'This build-only workflow does not run tests, lint, type checks, static analysis, accessibility checks, security checks, reviews, or screenshots.'
            ) -join [Environment]::NewLine
            $draft = gh api --method POST "repos/$env:REPOSITORY/releases" -f "tag_name=$releaseTag" -f "target_commitish=$env:EXPECTED_SHA" -f "name=Nazca Railway $releaseTag" -f "body=$body" -F draft=true | ConvertFrom-Json
            if (-not $draft.id -or -not $draft.draft -or $draft.tag_name -cne $releaseTag) { throw "Created draft is not the expected $releaseTag record." }
            foreach ($seedName in $seedNames) {
              $seedPath = Join-Path $seedDirectory $seedName
              $assetName = [Uri]::EscapeDataString($seedName)
              gh api --method POST "https://uploads.github.com/repos/$env:REPOSITORY/releases/$($draft.id)/assets?name=$assetName" --input $seedPath -H 'Content-Type: application/octet-stream' | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "Authenticated upload failed for $seedName." }
            }
            Set-Output 'release_id' ([string]$draft.id)
            Set-Output 'was_published' 'false'
          } finally {
            if (Test-Path -LiteralPath $seedDirectory) { Remove-Item -LiteralPath $seedDirectory -Recurse -Force }
          }

      - name: Verify generated assets and preserved corpus seed
        shell: pwsh
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE 'release-staging'
          $release = gh api "repos/$env:REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          $target = (gh api "repos/$env:REPOSITORY/commits/$($release.target_commitish)" --jq .sha).Trim()
          if ($target -ne $env:EXPECTED_SHA) { throw "Release target $target does not match $env:EXPECTED_SHA." }
          $corpus = Get-Content -Raw (Join-Path $stage 'corpus-manifest.json') | ConvertFrom-Json
          $raw = @($release.assets | Where-Object name -ceq $corpus.archive.name)
          if ($raw.Count -ne 1 -or $raw[0].size -ne $corpus.archive.bytes -or $raw[0].digest -ne "sha256:$($corpus.archive.sha256)") { throw 'Release corpus seed does not match the tracked manifest.' }
          foreach ($name in @('nazca-current-corpus-0.1.0.zip.sha256', 'archive-manifest.json')) {
            $asset = @($release.assets | Where-Object name -ceq $name)
            if ($asset.Count -ne 1 -or $asset[0].size -le 0) { throw "Release corpus seed asset is missing: $name" }
          }

      - name: Upload generated release assets without replacement
        shell: pwsh
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE 'release-staging'
          $release = gh api "repos/$env:REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          $existing = @($release.assets)
          foreach ($file in Get-ChildItem -LiteralPath $stage -File) {
            if ($file.Length -le 0) { throw "Generated asset is empty: $($file.Name)" }
            $localHash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $prior = @($existing | Where-Object name -ceq $file.Name)
            if ($prior.Count -gt 1) { throw "Release contains duplicate asset names: $($file.Name)" }
            if ($prior.Count -eq 1) {
              if ($prior[0].size -ne $file.Length -or $prior[0].digest -ne "sha256:$localHash") { throw "Existing release asset differs from this run: $($file.Name)" }
              continue
            }
            $assetName = [Uri]::EscapeDataString($file.Name)
            gh api --method POST "https://uploads.github.com/repos/$env:REPOSITORY/releases/$env:RELEASE_ID/assets?name=$assetName" --input $file.FullName -H 'Content-Type: application/octet-stream' | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Upload failed for $($file.Name)." }
          }

      - name: Verify uploaded release asset digests
        shell: pwsh
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE 'release-staging'
          $release = gh api "repos/$env:REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          foreach ($file in Get-ChildItem -LiteralPath $stage -File) {
            $asset = @($release.assets | Where-Object name -ceq $file.Name)
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($asset.Count -ne 1 -or $asset[0].size -ne $file.Length -or $asset[0].digest -ne "sha256:$hash") { throw "Uploaded asset digest mismatch: $($file.Name)" }
          }

      - name: Publish a new draft only
        if: steps.release.outputs.was_published != 'true'
        shell: pwsh
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: gh api --method PATCH "repos/$env:REPOSITORY/releases/$env:RELEASE_ID" -F draft=false | Out-Null

      - name: Write exact timing and version-only release evidence
        shell: pwsh
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          $release = gh api "repos/$env:REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if ($release.draft -or -not $release.published_at) { throw 'Published release has no verified publication timestamp.' }
          $run = gh api "repos/$env:REPOSITORY/actions/runs/${{ github.run_id }}" | ConvertFrom-Json
          $started = [DateTimeOffset]::Parse($run.run_started_at).ToUniversalTime()
          $completed = [DateTimeOffset]::Parse($release.published_at).ToUniversalTime()
          $duration = $completed - $started
          $durationText = '{0:D2}:{1:D2}:{2:D2}' -f [Math]::Floor($duration.TotalHours), $duration.Minutes, $duration.Seconds
          $marker = '## Verified delivery'
          $body = [string]$release.body
          $markerIndex = $body.IndexOf($marker, [StringComparison]::Ordinal)
          if ($markerIndex -ge 0) { $body = $body.Substring(0, $markerIndex).TrimEnd() }
          $evidence = @(
            '## Verified delivery',
            '',
            "- Workflow started: $($started.ToString('o'))",
            "- Workflow completed: $($completed.ToString('o'))",
            "- Workflow duration: $durationText",
            "- Source commit: $env:EXPECTED_SHA",
            '- Checks run by this workflow: none. This build-only workflow does not run tests, lint, type checks, static analysis, accessibility checks, security checks, reviews, or screenshots.',
            '- Release identity: numeric version only. No catalog code name or catalog photo is reused by this run.'
          ) -join [Environment]::NewLine
          $payloadPath = Join-Path $env:RUNNER_TEMP 'nazca-release-notes-payload.json'
          @{ body = ($body + [Environment]::NewLine + [Environment]::NewLine + $evidence) } | ConvertTo-Json -Compress | Set-Content -LiteralPath $payloadPath -Encoding utf8
          gh api --method PATCH "repos/$env:REPOSITORY/releases/$env:RELEASE_ID" --input $payloadPath | Out-Null

      - name: Verify published tag, target, assets, and timing
        shell: pwsh
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          $release = gh api "repos/$env:REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          $releaseTag = "v$env:RELEASE_VERSION"
          if ($release.draft -or $release.tag_name -cne $releaseTag) { throw "Published release is not the expected non-draft $releaseTag record." }
          $tagSha = (gh api "repos/$env:REPOSITORY/commits/$releaseTag" --jq .sha).Trim()
          if ($tagSha -ne $env:EXPECTED_SHA) { throw "$releaseTag targets $tagSha, expected $env:EXPECTED_SHA." }
          $required = @("nazca-railway-static-$env:RELEASE_VERSION.zip", "Nazca-Railway-$env:RELEASE_VERSION-Setup.exe", 'RELEASES', 'desktop-release-manifest.json', 'combined-release-manifest.json', 'SHA256SUMS.txt', 'line-count-report.json')
          foreach ($name in $required) {
            $asset = @($release.assets | Where-Object name -ceq $name)
            if ($asset.Count -ne 1 -or $asset[0].size -le 0 -or -not $asset[0].digest) { throw "Required release asset is missing, empty, or unhashed: $name" }
          }
          if (-not (@($release.assets | Where-Object { $_.name -match '(?i)\\.nupkg$' -and $_.name -notmatch '(?i)\\.delta\\.nupkg$' }).Count -ge 1)) { throw 'Full nupkg is missing.' }
          if (-not ([string]$release.body).Contains('## Verified delivery')) { throw 'Release evidence section is missing.' }
