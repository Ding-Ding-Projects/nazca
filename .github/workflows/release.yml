name: Build and publish Pages and release

on:
  push:
  workflow_dispatch:

concurrency:
  group: nazca-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_VERSION: '0.1.2'
  RELEASE_CODE_NAME: 'Bamboo Shoot Har Gow · 筍尖蝦餃'
  RELEASE_CODE_PHOTO_URL: 'https://github.com/Ding-Ding-Projects/dim-sum-photos/releases/download/catalog-v1/hk-dish-0003-bamboo-shoot-har-gow.png'

jobs:
  build-pages:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install project packages
        shell: pwsh
        run: npm ci --audit=false

      - name: Build the Pages bundle
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'nazca-pages-build.log'
          & node scripts/run-vinext.mjs build --pages 2>&1 | Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE
          "BUILD_EXIT=$exitCode" | Add-Content -LiteralPath $log
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Upload the Pages bundle
        if: ${{ always() }}
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: dist/client

      - name: Upload build evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: nazca-pages-build-${{ github.run_id }}
          path: |
            dist/client/**
            ${{ runner.temp }}/nazca-pages-build.log
          if-no-files-found: warn
          retention-days: 7

  deploy-pages:
    if: needs.build-pages.result == 'success' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    needs: build-pages
    runs-on: windows-2025
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-release:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install root packages from the lockfile
        shell: pwsh
        run: npm ci --audit=false

      - name: Build the root-path offline reader
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'nazca-release-build.log'
          & node scripts/run-vinext.mjs build --static 2>&1 | Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE
          "BUILD_EXIT=$exitCode" | Add-Content -LiteralPath $log
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Package the offline reader
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/package-offline-bundle.ps1

      - name: Install desktop packages from the lockfile
        shell: pwsh
        run: npm --prefix desktop ci --audit=false

      - name: Build the unsigned Squirrel.Windows installer
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'nazca-installer-build.log'
          & node scripts/desktop/package-squirrel.mjs 2>&1 | Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE
          "PACKAGE_EXIT=$exitCode" | Add-Content -LiteralPath $log
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Assemble and hash release assets
        shell: pwsh
        run: |
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $stage = [IO.Path]::GetFullPath((Join-Path $workspace 'release-staging'))
          $expectedStage = [IO.Path]::GetFullPath((Join-Path $workspace 'release-staging'))
          if ($stage -ne $expectedStage -or -not $stage.StartsWith($workspace + [IO.Path]::DirectorySeparatorChar)) { throw "Unsafe release staging path: $stage" }
          if (Test-Path -LiteralPath $stage) { Remove-Item -LiteralPath $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $packageVersion = (Get-Content -Raw (Join-Path $env:GITHUB_WORKSPACE 'package.json') | ConvertFrom-Json).version
          if ($packageVersion -ne $env:RELEASE_VERSION) { throw "Root package version $packageVersion does not match expected release $env:RELEASE_VERSION." }
          $releaseSpec = Get-Content -Raw (Join-Path $env:GITHUB_WORKSPACE 'data\release-v0.1.2.json') | ConvertFrom-Json
          if ($releaseSpec.version -ne $packageVersion -or $releaseSpec.tag -ne "v$packageVersion") { throw 'Release specification does not match the package version.' }
          if ($releaseSpec.codeName.display -ne $env:RELEASE_CODE_NAME -or $releaseSpec.codeName.assetUrl -ne $env:RELEASE_CODE_PHOTO_URL) { throw 'Release code-name metadata does not match the workflow.' }
          if ($releaseSpec.codeName.id -ne 'hk-dish-0003' -or $releaseSpec.codeName.assetRelease -ne 'catalog-v1' -or $releaseSpec.codeName.assetPath -ne 'hk-dish-0003-bamboo-shoot-har-gow.png') { throw 'Release code-name catalog identity is not the expected published record.' }
          if ($releaseSpec.codeName.assetBytes -ne 2400309 -or $releaseSpec.codeName.assetSha256 -ne '0b4165212c975f47076385acf9e01ed686c9974765d6476cc3cb36bbe46e45ad') { throw 'Release code-name asset digest metadata does not match the published catalog asset.' }
          if ($releaseSpec.corpus.archiveName -ne 'nazca-current-corpus-0.1.0.zip') { throw 'Release specification changed the raw v0.1.0 corpus archive identity.' }
          $staticName = "nazca-railway-static-$packageVersion.zip"
          $setupName = "Nazca-Railway-$packageVersion-Setup.exe"
          $static = Join-Path $env:GITHUB_WORKSPACE (Join-Path 'outputs' $staticName)
          $squirrel = Join-Path $env:GITHUB_WORKSPACE 'dist\desktop\squirrel-windows'
          $setup = Get-ChildItem -LiteralPath $squirrel -File | Where-Object { $_.Name -ceq $setupName } | Select-Object -First 1
          $releases = Get-ChildItem -LiteralPath $squirrel -File | Where-Object { $_.Name -ceq 'RELEASES' } | Select-Object -First 1
          $full = Get-ChildItem -LiteralPath $squirrel -File | Where-Object { $_.Name -match '(?i)\.nupkg$' -and $_.Name -notmatch '(?i)\.delta\.nupkg$' } | Select-Object -First 1
          if (-not (Test-Path -LiteralPath $static -PathType Leaf)) { throw "Static bundle is missing: $static" }
          if (-not $setup -or -not $releases -or -not $full) { throw "Squirrel.Windows outputs are incomplete for $packageVersion." }
          Copy-Item -LiteralPath $static -Destination (Join-Path $stage $staticName)
          Copy-Item -LiteralPath $setup.FullName -Destination (Join-Path $stage $setupName)
          Copy-Item -LiteralPath $releases.FullName -Destination (Join-Path $stage 'RELEASES')
          Copy-Item -LiteralPath $full.FullName -Destination (Join-Path $stage $full.Name)
          Get-ChildItem -LiteralPath $squirrel -File -Filter '*.delta.nupkg' | ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $stage $_.Name) }
          Copy-Item -LiteralPath (Join-Path $squirrel 'release-manifest.json') -Destination (Join-Path $stage 'desktop-release-manifest.json')
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'data\corpus\reader\v0.1.0\manifest.json') -Destination (Join-Path $stage 'corpus-manifest.json')
          & node scripts/count-lines.mjs --json | Set-Content -LiteralPath (Join-Path $stage 'line-count-report.json') -Encoding utf8
          $desktopManifest = Get-Content -Raw (Join-Path $stage 'desktop-release-manifest.json') | ConvertFrom-Json
          $combined = [ordered]@{ schemaVersion = 1; sourceCommit = (git rev-parse HEAD); version = $packageVersion; staticBundle = $staticName; desktopManifest = 'desktop-release-manifest.json'; desktopFiles = $desktopManifest.files; generatedAt = (Get-Date).ToUniversalTime().ToString('o') }
          $combined | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $stage 'combined-release-manifest.json') -Encoding utf8
          $sumLines = Get-ChildItem -LiteralPath $stage -File | Sort-Object Name | ForEach-Object { $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); "$hash  $($_.Name)" }
          $sumLines | Set-Content -LiteralPath (Join-Path $stage 'SHA256SUMS.txt') -Encoding ascii
          foreach ($file in Get-ChildItem -LiteralPath $stage -File) { if ($file.Length -le 0) { throw "Release asset is empty: $($file.Name)" } }

      - name: Upload safe release outputs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: nazca-release-assets-${{ github.run_id }}
          path: release-staging/*
          if-no-files-found: warn
          retention-days: 7

      - name: Upload release logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: nazca-release-logs-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/nazca-release-build.log
            ${{ runner.temp }}/nazca-installer-build.log
          if-no-files-found: warn
          retention-days: 7

  publish-release:
    if: needs.build-release.result == 'success' && needs.deploy-pages.result == 'success' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    needs: [build-release, deploy-pages]
    runs-on: windows-2025
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
      EXPECTED_SHA: ${{ github.sha }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Download generated release outputs
        uses: actions/download-artifact@v4
        with:
          name: nazca-release-assets-${{ github.run_id }}
          path: release-staging

      - name: Create or locate the unique numeric v0.1.2 draft
        id: draft
        shell: pwsh
        run: |
          $releaseTag = "v$env:RELEASE_VERSION"
          if ($releaseTag -notmatch '^v\d+\.\d+\.\d+$') { throw "Release tag is not numeric: $releaseTag" }
          $releases = @(gh api "repos/$env:REPOSITORY/releases?per_page=100" | ConvertFrom-Json)
          $tagged = @($releases | Where-Object { $_.tag_name -eq $releaseTag -and $_.tag_name -match '^v\d+\.\d+\.\d+$' })
          $published = @($tagged | Where-Object { -not $_.draft })
          if ($published.Count -gt 0) { throw "A published $releaseTag already exists; refusing to create a duplicate release." }
          $drafts = @($tagged | Where-Object { $_.draft })
          if ($drafts.Count -gt 1) { throw "Expected at most one numeric $releaseTag draft, found $($drafts.Count)." }
          if ($drafts.Count -eq 1) {
            "release_id=$($drafts[0].id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            $body = @"
# Nazca Railway v$env:RELEASE_VERSION

**Code name:** $env:RELEASE_CODE_NAME

**Public reader:** https://ding-ding-projects.github.io/nazca/

This release carries the completed Reader 1b state work on the default branch. The raw current-corpus archive remains the unchanged `nazca-current-corpus-0.1.0.zip` asset from v0.1.0.

The public code-name photo is linked from the catalog and is not copied into this release:
$env:RELEASE_CODE_PHOTO_URL

## Verification boundary

This build-only workflow does not run tests, lint, type checks, static analysis, accessibility checks, security checks, reviews, or screenshots.
"@
            $trackedCorpus = Get-Content -Raw (Join-Path $env:GITHUB_WORKSPACE 'data\corpus\reader\v0.1.0\manifest.json') | ConvertFrom-Json
            $sourceReleases = @(gh api "repos/$env:REPOSITORY/releases?per_page=100" | ConvertFrom-Json | Where-Object { $_.tag_name -eq 'v0.1.1' -and -not $_.draft -and -not $_.prerelease })
            if ($sourceReleases.Count -ne 1) { throw "Expected exactly one published v0.1.1 source release, found $($sourceReleases.Count)." }
            $sourceRelease = $sourceReleases[0]
            $seedNames = @('nazca-current-corpus-0.1.0.zip', 'nazca-current-corpus-0.1.0.zip.sha256', 'archive-manifest.json')
            $seedAssets = @{}
            foreach ($seedName in $seedNames) {
              $matches = @($sourceRelease.assets | Where-Object name -ceq $seedName)
              if ($matches.Count -ne 1 -or $matches[0].size -le 0) { throw "Published v0.1.1 source release does not contain exactly one nonempty $seedName asset." }
              $seedAssets[$seedName] = $matches[0]
            }
            $seedDirectory = Join-Path $env:RUNNER_TEMP "nazca-v0.1.2-corpus-seed-$($env:GITHUB_RUN_ID)"
            if (Test-Path -LiteralPath $seedDirectory) { Remove-Item -LiteralPath $seedDirectory -Recurse -Force }
            New-Item -ItemType Directory -Path $seedDirectory -Force | Out-Null
            try {
              foreach ($seedName in $seedNames) {
                $seedPath = Join-Path $seedDirectory $seedName
                gh api "repos/$env:REPOSITORY/releases/assets/$($seedAssets[$seedName].id)" -H 'Accept: application/octet-stream' --output $seedPath
                if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $seedPath -PathType Leaf)) { throw "Authenticated download failed for $seedName." }
                $seedFile = Get-Item -LiteralPath $seedPath
                if ($seedFile.Length -le 0 -or $seedFile.Length -ne [int64]$seedAssets[$seedName].size) { throw "Downloaded $seedName has an unexpected size." }
              }
              $archiveName = [string]$trackedCorpus.archive.name
              if ($archiveName -ne 'nazca-current-corpus-0.1.0.zip') { throw 'Tracked corpus manifest changed the required v0.1.0 archive name.' }
              $archivePath = Join-Path $seedDirectory $archiveName
              if ((Get-Item -LiteralPath $archivePath).Length -ne [int64]$trackedCorpus.archive.bytes) { throw 'Downloaded raw corpus archive size does not match the tracked corpus manifest.' }
              $archiveHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($archiveHash -ne $trackedCorpus.archive.sha256) { throw "Downloaded raw corpus archive SHA-256 $archiveHash does not match the tracked corpus manifest." }
              $checksumText = Get-Content -Raw -LiteralPath (Join-Path $seedDirectory 'nazca-current-corpus-0.1.0.zip.sha256')
              if (-not $checksumText.Contains($trackedCorpus.archive.sha256) -or -not $checksumText.Contains($archiveName)) { throw 'Downloaded raw corpus checksum does not contain the tracked archive name and SHA-256.' }
              $archiveManifest = Get-Content -Raw -LiteralPath (Join-Path $seedDirectory 'archive-manifest.json') | ConvertFrom-Json
              if ($archiveManifest.archive -ne $archiveName -or $archiveManifest.articlePages -ne $trackedCorpus.counts.articles -or $archiveManifest.redirectPages -ne $trackedCorpus.counts.redirects) { throw 'Downloaded archive manifest does not match the tracked corpus manifest.' }
              $created = gh api --method POST "repos/$env:REPOSITORY/releases" -f "tag_name=$releaseTag" -f "target_commitish=$env:EXPECTED_SHA" -f "name=Nazca Railway v$env:RELEASE_VERSION · $env:RELEASE_CODE_NAME" -f "body=$body" -F draft=true | ConvertFrom-Json
              if (-not $created.id -or -not $created.draft -or $created.tag_name -ne $releaseTag) { throw "Created release draft is not the expected $releaseTag record." }
              foreach ($seedName in $seedNames) {
                $seedPath = Join-Path $seedDirectory $seedName
                $assetName = [Uri]::EscapeDataString($seedName)
                gh api --method POST "https://uploads.github.com/repos/$env:REPOSITORY/releases/assets?name=$assetName" --input $seedPath -H 'Content-Type: application/octet-stream' | Out-Null
                if ($LASTEXITCODE -ne 0) { throw "Authenticated upload failed for $seedName." }
              }
              $seededDraft = gh api "repos/$env:REPOSITORY/releases/$($created.id)" | ConvertFrom-Json
              foreach ($seedName in $seedNames) {
                $uploaded = @($seededDraft.assets | Where-Object name -ceq $seedName)
                if ($uploaded.Count -ne 1 -or $uploaded[0].size -ne (Get-Item -LiteralPath (Join-Path $seedDirectory $seedName)).Length) { throw "New v0.1.2 draft does not contain exactly one validated $seedName asset." }
              }
            } finally {
              if (Test-Path -LiteralPath $seedDirectory) { Remove-Item -LiteralPath $seedDirectory -Recurse -Force }
            }
            "release_id=$($created.id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Verify generated assets and preserve corpus assets
        shell: pwsh
        env:
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE 'release-staging'
          foreach ($file in Get-ChildItem -LiteralPath $stage -File) { if ($file.Length -le 0) { throw "Generated asset is empty: $($file.Name)" } }
          $release = gh api "repos/$env:REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if (-not $release.target_commitish) { throw "The $env:RELEASE_VERSION draft has no target commit." }
          $draftTarget = gh api "repos/$env:REPOSITORY/commits/$($release.target_commitish)" --jq .sha
          if ($draftTarget.Trim() -ne $env:EXPECTED_SHA) { throw "Draft target $($draftTarget.Trim()) does not match $env:EXPECTED_SHA." }
          $checksums = @{}
          foreach ($line in Get-Content -LiteralPath (Join-Path $stage 'SHA256SUMS.txt')) { if ($line -match '^([0-9a-fA-F]{64})\s{2}(.+)$') { $checksums[$matches[2]] = $matches[1].ToLowerInvariant() } }
          foreach ($file in Get-ChildItem -LiteralPath $stage -File | Where-Object Name -ne 'SHA256SUMS.txt') { $actual = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); if ($checksums[$file.Name] -ne $actual) { throw "SHA-256 mismatch for generated asset: $($file.Name)" } }
          $names = @($release.assets | ForEach-Object name)
          if (-not ($names -contains 'nazca-current-corpus-0.1.0.zip')) { throw 'Pre-uploaded raw corpus archive is missing from the draft.' }
          if (-not ($names | Where-Object { $_ -match '(?i)current-corpus.*(sha256|checksum)' })) { throw 'Pre-uploaded raw corpus checksum is missing from the draft.' }
          if (-not ($names | Where-Object { $_ -match '(?i)archive-manifest' })) { throw 'Pre-uploaded corpus archive manifest is missing from the draft.' }
          $corpus = Get-Content -Raw (Join-Path $stage 'corpus-manifest.json') | ConvertFrom-Json
          $raw = @($release.assets | Where-Object name -eq $corpus.archive.name) | Select-Object -First 1
          if (-not $raw -or $raw.size -ne $corpus.archive.bytes) { throw 'Pre-uploaded raw corpus archive size does not match the tracked manifest.' }
          if (-not $raw.digest -or $raw.digest -ne "sha256:$($corpus.archive.sha256)") { throw "Pre-uploaded raw corpus archive digest $($raw.digest) does not match the tracked manifest." }
          $checksumAsset = @($release.assets | Where-Object { $_.name -match '(?i)current-corpus.*(sha256|checksum)' }) | Select-Object -First 1
          $checksumText = gh api "repos/$env:REPOSITORY/releases/assets/$($checksumAsset.id)" -H 'Accept: application/octet-stream'
          if (-not ([string]$checksumText).Contains($corpus.archive.sha256)) { throw 'Pre-uploaded raw corpus checksum does not contain the tracked archive SHA-256.' }
          $archiveAsset = @($release.assets | Where-Object { $_.name -match '(?i)archive-manifest' }) | Select-Object -First 1
          $archiveManifest = gh api "repos/$env:REPOSITORY/releases/assets/$($archiveAsset.id)" -H 'Accept: application/octet-stream' | ConvertFrom-Json
          if ($archiveManifest.archive -ne $corpus.archive.name -or $archiveManifest.articlePages -ne $corpus.counts.articles -or $archiveManifest.redirectPages -ne $corpus.counts.redirects) { throw 'Pre-uploaded archive manifest does not match the tracked corpus manifest.' }

      - name: Upload generated release assets without replacing corpus assets
        shell: pwsh
        env:
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE 'release-staging'
          $release = gh api "repos/$env:REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          $existing = @($release.assets)
          $files = Get-ChildItem -LiteralPath $stage -File
          if (-not $files) { throw 'No generated release assets were assembled.' }
          foreach ($file in $files) {
            $prior = $existing | Where-Object name -eq $file.Name
            if ($prior) {
              if ($prior.size -ne $file.Length) { throw "Existing release asset has a different size: $($file.Name)" }
              continue
            }
            $assetName = [Uri]::EscapeDataString($file.Name)
            gh api --method POST "https://uploads.github.com/repos/$env:REPOSITORY/releases/$env:RELEASE_ID/assets?name=$assetName" --input $file.FullName -H 'Content-Type: application/octet-stream' | Out-Null
          }

      - name: Verify uploaded assets against local SHA-256 records
        shell: pwsh
        env:
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE 'release-staging'
          $release = gh api "repos/$env:REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          $checksums = @{}
          foreach ($line in Get-Content -LiteralPath (Join-Path $stage 'SHA256SUMS.txt')) { if ($line -match '^([0-9a-fA-F]{64})\s{2}(.+)$') { $checksums[$matches[2]] = $matches[1].ToLowerInvariant() } }
          $checksumsDigest = (Get-FileHash -LiteralPath (Join-Path $stage 'SHA256SUMS.txt') -Algorithm SHA256).Hash.ToLowerInvariant()
          foreach ($file in Get-ChildItem -LiteralPath $stage -File | Where-Object Name -ne 'release-notes.md') {
            $asset = $release.assets | Where-Object name -eq $file.Name
            if (-not $asset -or $asset.size -le 0) { throw "Uploaded asset is missing or empty: $($file.Name)" }
            $expected = if ($file.Name -eq 'SHA256SUMS.txt') { $checksumsDigest } else { $checksums[$file.Name] }
            if (-not $expected -or -not $asset.digest -or $asset.digest -ne "sha256:$expected") { throw "Uploaded asset digest mismatch: $($file.Name)" }
          }

      - name: Publish the existing draft
        shell: pwsh
        env:
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: gh api --method PATCH "repos/$env:REPOSITORY/releases/$env:RELEASE_ID" -F draft=false | Out-Null

      - name: Add exact timing and release evidence by numeric ID
        shell: pwsh
        env:
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          $release = gh api "repos/$env:REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if ($release.draft -or -not $release.published_at) { throw 'Published release has no verified publication timestamp.' }
          $run = gh api "repos/$env:REPOSITORY/actions/runs/${{ github.run_id }}" | ConvertFrom-Json
          $started = [DateTimeOffset]::Parse($run.run_started_at).ToUniversalTime()
          $completed = [DateTimeOffset]::Parse($release.published_at).ToUniversalTime()
          $duration = $completed - $started
          $body = [string]$release.body
          $body += "`n`n## Verified delivery`n`n- Workflow started: $($started.ToString('o'))`n- Workflow completed: $($completed.ToString('o'))`n- Workflow duration: $($duration.ToString('hh\:mm\:ss'))`n- Source commit: $env:EXPECTED_SHA`n- Checks run by this workflow: none. This build-only workflow does not run tests, lint, type checks, static analysis, accessibility checks, security checks, reviews, or screenshots.`n- Code name: $env:RELEASE_CODE_NAME. Photo: $env:RELEASE_CODE_PHOTO_URL"
          $stage = Join-Path $env:GITHUB_WORKSPACE 'release-staging'
          $notesPath = Join-Path $stage 'release-notes.md'
          $body | Set-Content -LiteralPath $notesPath -Encoding utf8
          gh api --method PATCH "repos/$env:REPOSITORY/releases/$env:RELEASE_ID" -F "body=@$notesPath" | Out-Null

      - name: Verify published tag, target, assets, and timing
        shell: pwsh
        env:
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          $release = gh api "repos/$env:REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          $releaseTag = "v$env:RELEASE_VERSION"
          if ($release.draft -or $release.tag_name -ne $releaseTag) { throw "Published release is not the expected non-draft $releaseTag record." }
          $tagSha = gh api "repos/$env:REPOSITORY/commits/$releaseTag" --jq .sha
          if ($tagSha.Trim() -ne $env:EXPECTED_SHA) { throw "$releaseTag targets $($tagSha.Trim()), expected $env:EXPECTED_SHA." }
          $assets = @($release.assets)
          $required = @("nazca-railway-static-$env:RELEASE_VERSION.zip", "Nazca-Railway-$env:RELEASE_VERSION-Setup.exe", 'RELEASES', 'desktop-release-manifest.json', 'combined-release-manifest.json', 'SHA256SUMS.txt', 'line-count-report.json')
          foreach ($name in $required) { $asset = $assets | Where-Object name -eq $name; if (-not $asset -or $asset.size -le 0) { throw "Required release asset is missing or empty: $name" } }
          if (-not ($assets | Where-Object { $_.name -match '(?i)\.nupkg$' -and $_.name -notmatch '(?i)\.delta\.nupkg$' })) { throw 'Full nupkg is missing.' }
          $delta = @($assets | Where-Object { $_.name -match '(?i)\.delta\.nupkg$' })
          Write-Host "Generated delta nupkg count: $($delta.Count)"
          if (-not ($assets | Where-Object name -eq 'nazca-current-corpus-0.1.0.zip')) { throw 'Raw corpus archive was not preserved.' }
          if (-not ($assets | Where-Object { $_.name -match '(?i)current-corpus.*(sha256|checksum)' })) { throw 'Raw corpus checksum was not preserved.' }
          if (-not ($assets | Where-Object { $_.name -match '(?i)archive-manifest' })) { throw 'Raw corpus archive manifest was not preserved.' }
